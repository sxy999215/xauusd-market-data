# Hourly XAUUSD (Jinrong 1m) update for sxy999215/xauusd-market-data.
# Pulls only the last 2 hours, merges by timestamp (dedup), regenerates the
# 1m/5m/1h CSVs, weekly 1m shards, daily raw shards, manifest and log.
# One commit per run, only when files actually changed.
# NOTE (2026-11-13): the Jinrong fetch in scripts/jinrong_fetch.py is not
# wired yet (endpoint + payload decryption live in the hand-run script).
# Until then runs SKIP cleanly with no commit and no failure.
name: Hourly gold update

on:
  schedule:
    - cron: "7 * * * *"  # hourly, 07 past the hour UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update K-lines
        run: python3 scripts/update.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data UPDATE_LOG.md
          git diff --cached --quiet || git commit -m "Hourly gold K-line update (latest $(python3 -c "import json; print(json.load(open('data/manifest.json'))['latest_kline_utc'])") UTC)"
          git push
